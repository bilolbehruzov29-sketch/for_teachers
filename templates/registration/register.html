{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="card small auth-card">
    <div class="icon">✨</div>
    <h1>Создать аккаунт</h1>
    <p class="gray-text">Только имя и пароль — и всё готово</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn gold">Зарегистрироваться</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</div>
{% endblock %}
